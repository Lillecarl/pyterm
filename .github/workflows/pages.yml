# Generated by hand for now: the site's job is one build and one
# deploy, and there is nothing here a renderer would simplify.

name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        timeout-minutes: 10
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
        timeout-minutes: 15
      - name: Build the galleries and the page around them
        run: nix build --file . site -o site --print-build-logs
        timeout-minutes: 110
      - name: Prepare the Pages artifact
        run: |
          mkdir public
          cp -rL site/* public/
        timeout-minutes: 10
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
        timeout-minutes: 15

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
