# Not a package: the lab runs from its directory, and pytest reads this.
[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
extend = "../ruff.toml"
# What the probes import is written to be awkward on purpose.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint.isort]
known-first-party = ["lazylab", "probes"]
