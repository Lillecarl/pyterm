[package]
name = "pysmithay"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3.34"

[profile.release]
lto = true
codegen-units = 1
