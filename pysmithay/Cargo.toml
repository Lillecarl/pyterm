[workspace]
members = [".", "core"]

[package]
name = "pysmithay"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pysmithay-core = { path = "core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.release]
lto = true
codegen-units = 1
