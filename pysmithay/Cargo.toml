[package]
name = "pysmithay"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }

[profile.release]
lto = true
codegen-units = 1
